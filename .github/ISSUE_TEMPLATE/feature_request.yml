name: Feature request
description: Suggest a feature
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I acknowledge this project is licensed under AGPL-3.0.
          required: true