name: PR Size

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const total = (pr.additions || 0) + (pr.deletions || 0)
            const labels = [
              [10, "size/XS"],
              [50, "size/S"],
              [200, "size/M"],
              [500, "size/L"],
              [Infinity, "size/XL"],
            ]
            const label = labels.find(([limit]) => total <= limit)[1]
            const sizeLabels = ["size/XS", "size/S", "size/M", "size/L", "size/XL"]
            const colors = { "size/XS": "c5def5", "size/S": "bfe5bf", "size/M": "fbca04", "size/L": "f9a825", "size/XL": "e11d48" }
            for (const l of sizeLabels) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: l,
                color: colors[l],
              }).catch(() => {})
            }
            const existing = (pr.labels || []).map(l => l.name).filter(n => sizeLabels.includes(n))
            if (existing.length) {
              await github.rest.issues.removeLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: existing,
              }).catch(() => {})
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [label],
            })